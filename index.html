<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Exercicio Bootstrap</title>
</head>

<body>

    <body class="bg-light">
        <div class="container mt-5">
            <div class="card shadow-lg p-4 rounded">
                <h2 class="text-center text-primary mb-4">Formulário de Cadastro</h2>
                <form>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control border-primary rounded-pill" id="nome"
                            placeholder="Digite seu nome">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control border-primary rounded-pill" id="email"
                            placeholder="Digite seu e-mail">
                    </div>
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="tel" class="form-control border-primary rounded-pill" id="telefone"
                            placeholder="Digite seu telefone">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill">Enviar</button>
                </form>
            </div>
        </div>


    </body>

</html>
